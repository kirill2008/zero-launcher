name: release

# Выпуск версии — один из двух способов:
#   1) Actions → release → Run workflow: тег vX.Y.Z создаётся сам по appVersion из util.go;
#   2) git tag v2.0.3 && git push origin v2.0.3 — тег должен совпадать с appVersion.
# Перед этим: поднять appVersion в util.go и дописать раздел в CHANGELOG.md.
# Workflow соберёт ZeroLauncher.exe и выложит его на странице Releases.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Версия
        shell: bash
        run: |
          v=$(sed -n 's/^const appVersion = "\(.*\)"$/\1/p' util.go)
          if [ -z "$v" ]; then
            echo "::error::Не найден appVersion в util.go"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "v$v" != "$GITHUB_REF_NAME" ]; then
              echo "::error::В util.go appVersion = $v, а тег $GITHUB_REF_NAME"
              exit 1
            fi
          elif gh release view "v$v" >/dev/null 2>&1; then
            echo "::error::Версия $v уже выпущена. Поднимите appVersion в util.go и допишите CHANGELOG.md"
            exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "TAG=v$v" >> "$GITHUB_ENV"

      - name: Тесты Windows
        run: go test -count=1 -run "^TestWin" ./...

      - name: Сборка
        run: go build -trimpath -ldflags "-H windowsgui" -o ZeroLauncher.exe .

      - name: Контрольная сумма
        shell: pwsh
        run: |
          $h = (Get-FileHash ZeroLauncher.exe -Algorithm SHA256).Hash.ToLower()
          "$h  ZeroLauncher.exe" | Out-File -Encoding ascii ZeroLauncher.exe.sha256

      - name: Описание релиза
        shell: bash
        run: |
          awk -v v="$VERSION" '
            $0 == "## " v { f = 1; next }
            /^## / { f = 0 }
            f
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Как установить

          Скачайте `ZeroLauncher.exe` ниже, положите в любую папку и запустите. Python и другие программы не нужны.

          Файл не подписан, поэтому Windows может показать «Система Windows защитила ваш компьютер». Нажмите «Подробнее», затем «Выполнить в любом случае». Контрольная сумма SHA-256 — в файле `ZeroLauncher.exe.sha256`.
          EOF
          cat notes.md

      - name: Публикация
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # релиз уже создан вручную на сайте — добавляем файлы, пустое описание заполняем
            gh release upload "$TAG" ZeroLauncher.exe ZeroLauncher.exe.sha256 --clobber
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
          else
            gh release create "$TAG" ZeroLauncher.exe ZeroLauncher.exe.sha256 \
              --title "Zero Launcher $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          fi
